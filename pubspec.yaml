name: app_acc_transito
description: Aplicación para digitalizar accidentes de tráfico.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  cryptography: ^2.7.0
  path: ^1.9.0
  sqflite: ^2.3.3+1
  geolocator: ^14.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  mime: ^2.1.0
  qr: ^3.0.2
  pdf: ^3.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_transito.png
