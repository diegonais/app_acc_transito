plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('key.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def hasReleaseSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
    signingProperties.getProperty(it)?.trim()
}
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }
            && !hasReleaseSigning) {
        throw new GradleException('Release requiere android/key.properties y un keystore privado. No se permite firma debug.')
    }
}

android {
    namespace "com.example.app_acc_transito"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion
    
    defaultConfig {
        applicationId "com.example.app_acc_transito"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }
    
    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
        }
    }
}

flutter {
    source '../..'
}
